name: Build PS Vita VPK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      # The contract tests read the sources and check what they promise - the
      # launcher screens, the netgame arguments, the settings file, and the
      # headers of the artwork. They need nothing but the standard library, so
      # they run in this container as they are, before the compile.
      - name: Contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
      - name: Build VPK
        run: cmake --build build --parallel 1
      - name: Verify the VPK exists
        run: ls -l build/ChexQuestCollection.vpk
      # Artifact storage is metered in private repositories and the account-wide
      # quota can be full, so a failed artifact upload must not fail the build
      # (the VPK is published as a release asset below).
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Chex-Quest-Collection-Vita
          path: build/ChexQuestCollection.vpk
          if-no-files-found: error
      # Public repositories take their VPK from the artifacts above; private
      # ones get a rolling pre-release instead, so the newest test build always
      # has a stable download link.
      - name: Publish the VPK as a rolling CI release
        if: github.event_name == 'push' && github.event.repository.private
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: Latest CI build
          body: |
            Rolling pre-release with the newest VPK built by CI — testing only.

            Commit: `${{ github.sha }}` on `${{ github.ref_name }}`
          prerelease: true
          files: build/ChexQuestCollection.vpk
