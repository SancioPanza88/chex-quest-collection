name: Build PS Vita VPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
      - name: Build VPK
        run: cmake --build build --parallel 1
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: Chex-Quest-Collection-Vita
          path: build/ChexQuestCollection.vpk
          if-no-files-found: error
